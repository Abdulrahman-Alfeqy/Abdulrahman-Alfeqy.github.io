<head>

</head>
<body>

<!-- ══════════════════════════════════════
     STARFIELD CANVAS
══════════════════════════════════════ -->
<canvas id="stars" aria-hidden="true"></canvas>

<!-- ══════════════════════════════════════
     TITLE SCREEN
══════════════════════════════════════ -->
<div id="title-screen" class="screen active">
  <div class="title-glow">
    <div class="title-game glitch" id="t-name"></div>
    <div class="title-sub">QUEST FOR THE CODE</div>
    <span class="hero-sprite" id="t-avatar"></span>
    <div id="t-role" class="title-role"></div>
    <div id="t-level" class="title-level"></div>
    <div id="t-tagline" class="title-tagline"></div>
    <div id="t-context" class="title-context"></div>
    <div class="title-actions">
      <a class="title-action title-resume" id="t-resume" href="assets/resume.pdf" target="_blank" rel="noopener noreferrer">↗ VIEW RESUME</a>
      <a class="title-action title-contact" id="t-contact" href="mailto:abdulrahmanalfky@gmail.com">✉ CONTACT</a>
    </div>
    <button class="press-start" onclick="startGame()">▶  PRESS START</button>
    <div class="title-credits" id="t-copy"></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     HUD (top bar)
══════════════════════════════════════ -->
<div id="hud">
  <span class="hud-name" id="hud-name"></span>
  <div class="bar-wrap">
    <span class="bar-label">HP</span>
    <div class="bar"><div class="bar-fill hp-fill" style="width:92%"></div></div>
  </div>
  <div class="bar-wrap">
    <span class="bar-label">XP</span>
    <div class="bar"><div class="bar-fill xp-fill" id="xp-bar" style="width:74%"></div></div>
  </div>
  <span class="hud-level" id="hud-level"></span>

  <!-- Audio Controls -->
  <div class="audio-controls">
    <button class="audio-btn active" id="btn-music" onclick="toggleMusic()" title="Toggle Background Music">
      <span class="audio-icon">♪</span>
      <span class="audio-label">ANTHEM</span>
    </button>
    <button class="audio-btn active" id="btn-sfx" onclick="toggleSFX()" title="Toggle Sound Effects">
      <span class="audio-icon">*</span>
      <span class="audio-label">SPELL</span>
    </button>
  </div>

  <nav class="hud-nav" aria-label="Main portfolio sections">
    <button class="nav-btn" onclick="playClick();showZone('about')">👤 About</button>
    <button class="nav-btn" onclick="playClick();showZone('skills')">⚡ Skills</button>
    <button class="nav-btn" onclick="playClick();showZone('experience')">💼 EXP</button>
    <button class="nav-btn" onclick="playClick();showZone('projects')">🏗 Projects</button>
    <button class="nav-btn" onclick="playClick();showZone('blogs')">✍️ Freelance</button>
    <button class="nav-btn" onclick="playClick();showZone('education')">🎓 Study</button>
    <button class="nav-btn" onclick="playClick();showZone('achievements')">🏆 Awards</button>
    <button class="nav-btn" onclick="playClick();showZone('contact')">📡 Contact</button>
    <button class="nav-btn" onclick="playClick();backToMap()">🗺 MAP</button>
  </nav>
</div>

<!-- ══════════════════════════════════════
     WORLD MAP
══════════════════════════════════════ -->
<div id="world-screen" class="screen">
  <div style="text-align:center; margin-bottom:16px;">
    <div style="font-family:'Press Start 2P',monospace; font-size:9px; color:var(--dim);">SELECT YOUR DESTINATION</div>
  </div>

  <!-- 6 main zones in a clean 3-col grid -->
  <div class="world-grid">
    <button type="button" class="zone-card" aria-label="Open character profile" onclick="showZone('about'); gainXP(this)">
      <span class="zone-icon">👤</span>
      <span class="zone-name">CHARACTER</span>
      <span class="zone-desc">Who is this hero?</span>
    </button>
    <button type="button" class="zone-card" aria-label="Open skills forge" onclick="showZone('skills'); gainXP(this)">
      <span class="zone-icon">⚡</span>
      <span class="zone-name">SKILLS FORGE</span>
      <span class="zone-desc">Tools grouped by applied area</span>
    </button>
    <button type="button" class="zone-card" aria-label="Open work experience" onclick="showZone('experience'); gainXP(this)">
      <span class="zone-icon">💼</span>
      <span class="zone-name">BATTLE LOG</span>
      <span class="zone-desc">Wars fought & won</span>
    </button>
    <button type="button" class="zone-card" aria-label="Open project portfolio" onclick="showZone('projects'); gainXP(this)">
      <span class="zone-icon">🏗</span>
      <span class="zone-name">ARTIFACT HALL</span>
      <span class="zone-desc">Epic creations forged</span>
    </button>
    <button type="button" class="zone-card" aria-label="Open freelance profiles" onclick="showZone('blogs'); gainXP(this)">
      <span class="zone-icon">✍️</span>
      <span class="zone-name">MERCENARY BOARD</span>
      <span class="zone-desc" id="freelance-zone-desc">Freelance profiles</span>
    </button>
    <button type="button" class="zone-card" aria-label="Open education and training" onclick="showZone('education'); gainXP(this)">
      <span class="zone-icon">🎓</span>
      <span class="zone-name">ACADEMY</span>
      <span class="zone-desc">Knowledge scrolls</span>
    </button>
  </div>

  <!-- Last 2 zones — always perfectly centred via flexbox -->
  <div class="world-grid-last">
    <button type="button" class="zone-card" aria-label="Open achievements" onclick="showZone('achievements'); gainXP(this)">
      <span class="zone-icon">🏆</span>
      <span class="zone-name">TROPHY VAULT</span>
      <span class="zone-desc">Legendary achievements</span>
    </button>
    <button type="button" class="zone-card" aria-label="Open contact information" onclick="showZone('contact'); gainXP(this)">
      <span class="zone-icon">📡</span>
      <span class="zone-name">SIGNAL TOWER</span>
      <span class="zone-desc">Send a message</span>
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════
     PANEL SCREEN (zones render here)
══════════════════════════════════════ -->
<div id="panel-screen" class="screen">
  <div class="panel-content" id="panel-content"></div>
</div>

══════════════════════════════════════ -->
<nav id="bottom-nav" aria-label="Portfolio section navigation">
  <button class="bnav-btn" onclick="playClick();backToMap()">
    <span class="bnav-icon">🗺</span>MAP
  </button>
  <button class="bnav-btn" onclick="playClick();showZone('about')">
    <span class="bnav-icon">👤</span>ABOUT
  </button>
  <button class="bnav-btn" onclick="playClick();showZone('skills')">
    <span class="bnav-icon">⚡</span>SKILLS
  </button>
  <button class="bnav-btn" onclick="playClick();showZone('experience')">
    <span class="bnav-icon">💼</span>EXP
  </button>
  <button class="bnav-btn" onclick="playClick();showZone('projects')">
    <span class="bnav-icon">🏗</span>PROJ
  </button>
  <button class="bnav-btn" onclick="playClick();showZone('blogs')">
    <span class="bnav-icon">✍️</span>FREELANCE
  </button>
  <button class="bnav-btn" onclick="playClick();showZone('education')">
    <span class="bnav-icon">🎓</span>EDU
  </button>
  <button class="bnav-btn" onclick="playClick();showZone('achievements')">
    <span class="bnav-icon">🏆</span>AWARDS
  </button>
  <button class="bnav-btn" onclick="playClick();showZone('contact')">
    <span class="bnav-icon">📡</span>CONTACT
  </button>
</nav>

<!-- ══════════════════════════════════════
     DIALOG BOX
══════════════════════════════════════ -->
<div id="dialog-box" role="region" aria-labelledby="dialog-name">
  <div class="dialog-name" id="dialog-name">NARRATOR</div>
  <div class="dialog-text" id="dialog-text" aria-live="polite" aria-atomic="true"></div>
  <button type="button" class="dialog-close" onclick="closeDialog()">▼ CONTINUE</button>
</div>

<!-- ══════════════════════════════════════
     SCRIPTS (config first, then main)
══════════════════════════════════════ -->
<script src="portfolio-config.js"></script>
<script src="main.js"></script>

</body>
</html>
