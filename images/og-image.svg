    <text x="22" y="38" fill="#ffd700" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">SYSTEM ONLINE</text>
    <circle cx="204" cy="33" r="6" fill="#00ff88" filter="url(#glow)"/>
    <path d="M125 76V109M125 201V234M54 155H84M166 155H196M74 104L95 125M155 185L176 206M176 104L155 125M95 185L74 206" stroke="#00e5ff" stroke-opacity=".7" stroke-width="3"/>
    <circle cx="125" cy="155" r="48" fill="#101d45" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>
    <path d="M104 146h42M104 158h42M111 170h28" stroke="#f2f5ff" stroke-width="5" stroke-linecap="square"/>
