    <circle cx="196" cy="155" r="9" fill="#b44bff"/>
    <circle cx="74" cy="104" r="7" fill="#00e5ff"/>
    <circle cx="176" cy="104" r="7" fill="#00e5ff"/>
    <circle cx="74" cy="206" r="7" fill="#00e5ff"/>
    <circle cx="176" cy="206" r="7" fill="#00e5ff"/>
    <rect x="26" y="254" width="198" height="8" rx="4" fill="#1c294e"/>
    <rect x="26" y="254" width="146" height="8" rx="4" fill="url(#accent)"/>
    <text x="26" y="288" fill="#97a4ce" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">BUILD · LEARN · SHIP</text>
  </g>

  <text x="1080" y="565" text-anchor="end" fill="#7886b4" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">abdulrahman-alfeqy.github.io</text>
</svg>
